<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#D9F2EA">
<link rel="icon" type="image/png" href="icon-192.png">

<style>
:root{
  --bg:#D9F2EA;--card:#F7FFFC;--ink:#10302F;--muted:#4F706B;--shade:#10302F;
  --pimiento:#FF3B5C;--sun:#FFD43B;--lime:#9BE564;--ice:#8FD3FF;--grape:#7C6CFF;--pink:#FF9EC4;
  --frozen:#CBEBFF;--onc:#10302F;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0B1F1E;--card:#14302E;--ink:#E4FBF3;--muted:#8FB5AD;--shade:#000;--frozen:#173B4D}
}
:root[data-theme="dark"]{--bg:#0B1F1E;--card:#14302E;--ink:#E4FBF3;--muted:#8FB5AD;--shade:#000;--frozen:#173B4D}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Figtree,system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
button{font-family:inherit}
#app{max-width:520px;margin:0 auto;padding:12px 14px 130px}
h2{font:400 28px/1.1 "Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif;margin:8px 0 4px}
h3{font:800 16px/1.2 Figtree,system-ui,sans-serif;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.sec{font:400 19px/1.1 "Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif;margin:22px 0 10px}
.top{display:flex;align-items:flex-end;gap:8px;margin:4px 0 16px}
.logo{font:400 30px/1 "Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif;letter-spacing:-.5px;margin:0 0 6px 4px}
.bubble{position:relative;background:var(--card);border:2.5px solid var(--ink);border-radius:18px 18px 18px 4px;padding:9px 13px;font-size:14px;font-weight:700;box-shadow:3px 3px 0 var(--shade)}
.col{flex:1;min-width:0}
.mas{flex:none;overflow:visible}
.bob{animation:bob 2.8s ease-in-out infinite;transform-origin:40px 72px}
.panic .bob{animation:shake .35s linear infinite}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes shake{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.btn{font-weight:800;font-size:15px;border:2.5px solid var(--ink);background:var(--card);color:var(--ink);border-radius:14px;padding:10px 14px;box-shadow:3px 3px 0 var(--shade);cursor:pointer;transition:transform .08s,box-shadow .08s;line-height:1.1}
.btn:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--shade)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:12px;box-shadow:2px 2px 0 var(--shade)}
.btn.sm:active{transform:translate(2px,2px)}
.btn.pri{background:var(--pimiento);color:var(--onc)}
.btn.sun{background:var(--sun);color:var(--onc)}
.btn.lime{background:var(--lime);color:var(--onc)}
.btn.ice{background:var(--ice);color:var(--onc)}
.btn.grape{background:var(--grape);color:#fff}
.btn.block{width:100%}
:focus-visible{outline:3px solid var(--grape);outline-offset:2px}
.card{display:flex;gap:12px;align-items:center;background:var(--card);border:2.5px solid var(--ink);border-radius:22px;padding:10px 12px 10px 10px;margin-bottom:14px;box-shadow:4px 4px 0 var(--shade);cursor:pointer}
.card.frozen{background:var(--frozen)}
.ucard{display:block;cursor:default}
.ucard .row{cursor:pointer}
.row{display:flex;align-items:center;gap:12px}
.info{flex:1;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px;align-items:center}
.when{font-size:12px;color:var(--muted);font-weight:700;margin-top:3px}
.chip{display:inline-block;border:2px solid var(--ink);border-radius:99px;padding:0 8px;font-size:11px;font-weight:800;background:var(--card);line-height:18px}
.chip.ice{background:var(--ice);color:var(--onc)}
.chip.sun{background:var(--sun);color:var(--onc)}
.thumb{width:58px;height:58px;border-radius:16px;border:2.5px solid var(--ink);background:var(--bg);display:grid;place-items:center;font-size:31px;overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.big{width:84px;height:84px;font-size:42px;cursor:pointer}
.stamp{width:62px;height:62px;border-radius:50%;border:2.5px dashed var(--ink);outline:2.5px solid var(--ink);outline-offset:-7px;display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(8deg);color:var(--onc);flex:none;line-height:1;text-align:center}
.stamp b{font:400 23px/1 "Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif}
.stamp b.hoy{font-size:17px}
.stamp small{font-size:10px;font-weight:800;margin-top:1px}
.bites{display:flex;align-items:center;gap:2px;margin-top:4px}
.bite{border:0;background:none;padding:6px 1px;cursor:pointer}
.bite i{display:block;width:20px;height:9px;border-radius:5px;border:2px solid var(--ink)}
.bite i.on{background:var(--lime)}
.qtxt{font-size:11px;font-weight:700;color:var(--muted);margin-left:6px}
.box{background:var(--card);border:2.5px solid var(--ink);border-radius:20px;padding:14px;box-shadow:4px 4px 0 var(--shade);margin-bottom:14px}
.banner{display:flex;align-items:center;gap:10px;background:var(--sun);color:var(--onc);border:2.5px solid var(--ink);border-radius:18px;padding:10px 14px;margin-bottom:14px;font-weight:800;box-shadow:3px 3px 0 var(--shade);cursor:pointer}
.banner span{flex:1}
input,select{width:100%;font:500 16px Figtree,system-ui,sans-serif;padding:10px 12px;border:2.5px solid var(--ink);border-radius:12px;background:var(--card);color:var(--ink)}
.f{display:block}
.f>span{display:block;font-size:13px;font-weight:800;color:var(--muted);margin:12px 0 4px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 3px 12px}
.chips .btn{white-space:nowrap}
.btn.on{background:var(--ink);color:var(--bg)}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom,0px));width:min(500px,calc(100% - 20px));background:var(--card);border:2.5px solid var(--ink);border-radius:28px;box-shadow:4px 4px 0 var(--shade);display:flex;align-items:center;padding:6px;z-index:20}
.nv{flex:1;border:0;background:none;color:var(--ink);font-weight:800;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0;border-radius:18px;position:relative;cursor:pointer}
.nv .e{font-size:22px;line-height:1.1}
.nv.on{background:var(--sun);color:var(--onc)}
.nv.fab{flex:none;width:64px;height:64px;margin:-30px 6px 0;border-radius:50%;background:var(--pimiento);border:2.5px solid var(--ink);box-shadow:3px 3px 0 var(--shade);justify-content:center}
.nv.fab.on{background:var(--grape)}
.bd{position:absolute;top:1px;right:calc(50% - 26px);background:var(--pimiento);color:var(--onc);border:2px solid var(--ink);border-radius:99px;font-style:normal;font-size:11px;font-weight:800;min-width:20px;height:20px;line-height:16px;text-align:center}
#sheet{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:50}
#sheet.open{display:flex}
.panel{background:var(--bg);border:2.5px solid var(--ink);border-bottom:0;border-radius:28px 28px 0 0;width:min(520px,100%);max-height:92vh;overflow:auto;padding:16px 16px calc(26px + env(safe-area-inset-bottom,0px));animation:slide .22s ease-out}
@keyframes slide{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.ph{display:flex;align-items:center;gap:14px}
#toast{position:fixed;left:50%;bottom:calc(104px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:16px;padding:11px 16px;font-weight:800;font-size:14px;max-width:92%;z-index:60;display:flex;gap:14px;align-items:center;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:var(--sun);font-weight:800;font-size:14px;cursor:pointer;padding:0}
.conf{position:fixed;width:10px;height:14px;border-radius:3px;z-index:70;pointer-events:none;animation:fall 1.1s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes fall{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.vf{position:relative;aspect-ratio:4/3;border:2.5px solid var(--ink);border-radius:24px;background:#10302F;overflow:hidden;box-shadow:4px 4px 0 var(--shade);margin-bottom:14px}
.vf video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cn{position:absolute;width:38px;height:38px;border:5px solid var(--sun)}
.cn.a{top:16px;left:16px;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.cn.b{top:16px;right:16px;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.cn.c{bottom:16px;left:16px;border-right:0;border-top:0;border-radius:0 0 0 14px}
.cn.d{bottom:16px;right:16px;border-left:0;border-top:0;border-radius:0 0 14px 0}
.ln{position:absolute;left:12%;right:12%;height:3px;background:var(--pimiento);border-radius:2px;animation:sc 1.7s ease-in-out infinite alternate}
@keyframes sc{from{top:22%}to{top:76%}}
.vmsg{position:absolute;left:0;right:0;bottom:0;padding:10px 14px;background:rgba(16,48,47,.82);color:#E4FBF3;font-size:13px;font-weight:700;text-align:center}
.bar{height:13px;border:2px solid var(--ink);border-radius:8px;background:var(--bg);overflow:hidden}
.bar i{display:block;height:100%}
.nrow{margin-top:8px}
.nrow .l{display:flex;justify-content:space-between;font-size:12px;font-weight:700;margin-bottom:3px}
.stat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:12px;text-align:center}
.stat b{display:block;font:400 26px/1 "Bagel Fat One","Arial Rounded MT Bold",system-ui,sans-serif}
.stat span{font-size:12px;font-weight:700;color:var(--muted)}
.wk{display:flex;gap:12px;align-items:flex-end;height:110px;margin-top:12px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;font-weight:700;color:var(--muted);gap:4px}
.wk .st{width:100%;display:flex;flex-direction:column-reverse;border:2px solid var(--ink);border-radius:8px;overflow:hidden;min-height:4px}
.shop{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:2px dashed var(--muted)}
.shop:last-child{border-bottom:0}
.shop button.ck{width:28px;height:28px;border-radius:9px;border:2.5px solid var(--ink);background:var(--card);cursor:pointer;flex:none;font-size:16px;line-height:1;padding:0;color:var(--ink)}
.shop.done span{text-decoration:line-through;color:var(--muted)}
.shop span{flex:1;font-weight:700}
.shop .x{background:none;border:0;font-size:20px;color:var(--muted);cursor:pointer}
.rec{margin-bottom:12px}
.rec summary{list-style:none;display:flex;align-items:center;gap:12px;cursor:pointer}
.rec summary::-webkit-details-marker{display:none}
.rec p{margin:10px 0 0;font-size:14px}
.tog{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.tog small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.step{display:flex;align-items:center;gap:10px}
.step b{font:400 22px "Bagel Fat One",system-ui,sans-serif;min-width:26px;text-align:center}
.empty{text-align:center;padding:18px 8px}
.empty p{color:var(--muted);margin:6px 0 14px}
.note{font-size:12px;color:var(--muted);font-weight:500}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
(function(){
'use strict';
var KEY='tupper.v1';

var CATS={
 leche:{l:'Leche',e:'🥛',def:10,open:3,frz:90,thaw:2,fr:1,tags:['leche','lacteo']},
 yogur:{l:'Yogur y postres',e:'🍶',def:21,open:3,frz:60,thaw:2,fr:1,tags:['yogur','lacteo']},

 carne:{l:'Carne',e:'🍗',def:3,open:1,frz:180,thaw:1,fr:1,tags:['carne']},
 pescado:{l:'Pescado y marisco',e:'🐟',def:2,open:1,frz:90,thaw:1,fr:1,tags:['pescado']},
 fruta:{l:'Fruta',e:'🍎',def:6,open:3,frz:180,thaw:1,fr:0,tags:['fruta']},
 verdura:{l:'Verdura',e:'🥦',def:6,open:3,frz:240,thaw:1,fr:1,tags:['verdura']},
 pan:{l:'Pan y bollería',e:'🍞',def:4,open:3,frz:90,thaw:1,fr:0,tags:['pan']},
 huevos:{l:'Huevos',e:'🥚',def:28,open:21,frz:0,thaw:0,fr:0,tags:['huevos']},
 salsa:{l:'Salsas y conservas',e:'🍅',def:365,open:5,frz:120,thaw:2,fr:2,tags:['salsa']},
 legumbre:{l:'Legumbres cocidas',e:'🫘',def:540,open:3,frz:90,thaw:2,fr:2,tags:['legumbre']},
 snack:{l:'Galletas y snacks',e:'🍪',def:150,open:30,frz:0,thaw:0,fr:0,tags:['snack']},
 bebida:{l:'Bebidas',e:'🧃',def:180,open:5,frz:0,thaw:0,fr:2,tags:['bebida']},
 sobras:{l:'Sobras y platos cocinados',e:'🍲',def:3,open:3,frz:90,thaw:2,fr:1,tags:['sobras']},
 pasta:{l:'Pasta, arroz y cereales',e:'🍝',def:540,open:365,frz:0,thaw:0,fr:0,tags:['pasta']},
 untable:{l:'Untables y cremas',e:'🫙',def:30,open:5,frz:90,thaw:2,fr:2,tags:['untable']},
 otro:{l:'Otro',e:'📦',def:30,open:5,frz:0,thaw:0,fr:0,tags:[]}
};
var CAT_ORDER=Object.keys(CATS);
var KW=[['pollo','pollo'],['pollo','carne'],['pavo','carne'],['tomate','tomate'],['atún','pescado'],['garbanzo','legumbre'],['lenteja','legumbre'],['alubia','legumbre'],['arroz','pasta'],['macarr','pasta'],['espagueti','pasta']];
var RC=[
 {n:'Pollo con salsa de yogur',e:'🍗',need:['pollo','yogur'],s:'Corta el pollo en tiras y dóralo en la sartén. Mezcla el yogur con ajo, limón y sal, y sírvelo por encima.'},
 {n:'Huevos a la flamenca',e:'🍳',need:['huevos','tomate'],s:'Calienta el tomate en una cazuela de barro, rompe los huevos encima y hornea 8 minutos a 200 grados. Si tienes embutido, añádelo.'},
 {n:'Tortilla de aprovechamiento',e:'🥘',need:['huevos','verdura'],s:'Pocha la verdura troceada, mézclala con los huevos batidos y cuaja la tortilla por los dos lados.'},
 {n:'Torrijas rápidas',e:'🍞',need:['pan','leche','huevos'],s:'Empapa el pan en leche, pásalo por huevo batido y fríelo. Termina con azúcar y canela.'},
 {n:'Tostada de queso y tomate',e:'🧀',need:['pan','queso'],s:'Tuesta el pan, cubre con queso y gratina un par de minutos. Aliña con tomate rallado y aceite.'},
 {n:'Sándwich mixto',e:'🥪',need:['pan','embutido','queso'],s:'Monta el pan con embutido y queso y plánchalo hasta que se funda.'},
 {n:'Batido de fruta y yogur',e:'🥤',need:['fruta','yogur'],s:'Tritura la fruta madura con el yogur y un poco de leche o hielo.'},
 {n:'Pasta al tomate',e:'🍝',need:['pasta','tomate'],s:'Cuece la pasta, calienta el tomate con ajo y mézclalo todo con un chorrito de aceite.'},
 {n:'Ensalada de legumbres',e:'🥗',need:['legumbre','verdura'],s:'Escurre la legumbre y mézclala con verdura picada, aceite y vinagre.'},
 {n:'Compota casera',e:'🍎',need:['fruta'],s:'Cuece la fruta troceada con un chorrito de agua diez minutos. Congela lo que sobre en porciones.'},
 {n:'Crema de verduras',e:'🥦',need:['verdura'],s:'Cuece la verdura con agua y sal, tritúrala y termina con un hilo de aceite.'},
 {n:'Croquetas de aprovechamiento',e:'🍲',need:['sobras'],s:'Pica las sobras, mézclalas con bechamel espesa, reboza y fríe. Se congelan muy bien.'},
 {n:'Pescado al horno',e:'🐟',need:['pescado'],s:'Hornea con limón y aceite unos 15 minutos a 200 grados.'},
 {n:'Carne salteada con verduras',e:'🥩',need:['carne'],s:'Saltea la carne en tiras a fuego fuerte y añade la verdura que tengas.'}
];
var DEMO={
 '1111111111111':{name:'Yogur natural (ejemplo)',cat:'yogur',nut:{kcal:61,fat:3,sat:2,sug:4.7,salt:0.1},por:125},
 '2222222222222':{name:'Salchichón (ejemplo)',cat:'embutido',nut:{kcal:450,fat:38,sat:14,sug:1,salt:4},por:30},
 '3333333333333':{name:'Galletas María (ejemplo)',cat:'snack',nut:{kcal:430,fat:11,sat:2,sug:20,salt:0.6},por:30}
};

var S={items:[],log:[],shop:[],set:{win:3,auto:true,notif:false,lastNotif:''}};
var ui={tab:'home',f:'all',q:'',wipe:false};
var E=null,lastSnap=null,toastT=null;
var stream=null,camTimer=null,det=null,busy=false;

function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);S.items=o.items||[];S.log=o.log||[];S.shop=o.shop||[];S.set=Object.assign(S.set,o.set||{})}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function pad(n){return n<10?'0'+n:''+n}
function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function today(){return iso(new Date())}
function pd(s){var a=s.split('-');return new Date(+a[0],+a[1]-1,+a[2])}
function add(s,n){var d=pd(s);d.setDate(d.getDate()+n);return iso(d)}
function diff(a,b){return Math.round((pd(b)-pd(a))/864e5)}
function fmt(s){var far=Math.abs(diff(today(),s))>300;return pd(s).toLocaleDateString('es-ES',far?{day:'numeric',month:'short',year:'numeric'}:{day:'numeric',month:'short'})}
function find(id){for(var i=0;i<S.items.length;i++)if(S.items[i].id===id)return S.items[i];return null}
function remove(id){S.items=S.items.filter(function(p){return p.id!==id})}
function cat(p){return CATS[p.cat]||CATS.otro}
function frzTxt(c){return c.frz>=60?Math.round(c.frz/30)+' meses':c.frz+' días'}
function num(id){var v=$('#'+id).value;return v===''?null:parseFloat(v)}

function st(p){
  var c=cat(p),dl,mode;
  if(p.frozenOn){dl=add(p.frozenOn,c.frz||90);mode='frozen'}
  else if(p.thawedOn){dl=add(p.thawedOn,c.thaw||2);mode='thawed'}
  else{dl=p.exp||add(today(),c.def);mode='sealed';if(p.openedOn){var o=add(p.openedOn,c.open);if(o<dl)dl=o;mode='open'}}
  return {dl:dl,d:diff(today(),dl),mode:mode};
}

    s.style.setProperty('--dx',(Math.random()*320-160)+'px');
    s.style.setProperty('--dy',(Math.random()*300-60)+'px');
    s.style.setProperty('--r',(Math.random()*720-360)+'deg');
    document.body.appendChild(s);
    (function(el){setTimeout(function(){el.remove()},1200)})(s);
  }
  try{if(navigator.vibrate)navigator.vibrate(30)}catch(e){}
}
function maybeNotify(){
  try{
    if(!S.set.notif||!('Notification' in window)||Notification.permission!=='granted')return;
    var n=urgentList().length;
    if(n&&S.set.lastNotif!==today()){new Notification('Tupper',{body:n===1?'Hay 1 producto que pide atención.':'Hay '+n+' productos que piden atención.'});S.set.lastNotif=today();save()}
  }catch(e){}
}

/* acciones sobre productos */
function addShop(name){
  var k=name.trim().toLowerCase();if(!k)return false;
  for(var i=0;i<S.shop.length;i++)if(S.shop[i].name.toLowerCase()===k&&!S.shop[i].done)return false;
  S.shop.push({id:uid(),name:name.trim(),done:false});return true;
}
function consume(id){
  var p=find(id);if(!p)return;
  snap();var s=st(p),saved=s.d>=0&&s.d<=S.set.win;
  S.log.push({t:'ate',d:today(),n:p.name,sv:saved?1:0});
  var added=S.set.auto&&addShop(p.name);
  remove(id);save();closeSheet();render();
  toast(saved?'Salvado. Bien hecho'+(added?'. Añadido a la compra':''):'Anotado'+(added?'. Añadido a la compra':''),true);
  if(saved)confetti();
}
function waste(id){
  var p=find(id);if(!p)return;
  snap();S.log.push({t:'waste',d:today(),n:p.name,sv:0});
  remove(id);save();closeSheet();render();toast('Anotado. La próxima lo salvamos',true);
}
function del(id){snap();remove(id);save();closeSheet();render();toast('Producto eliminado',true)}
function freeze(id){
  var p=find(id),c=cat(p),s=st(p);
  if(!c.frz){toast('Este alimento no se recomienda congelarlo');return}
  if(p.thawedOn){toast('Ya estuvo congelado. No conviene volver a congelarlo');return}
  if(s.d<0){toast('Está pasado de fecha, mejor no congelarlo');return}
  snap();p.frozenOn=today();save();closeSheet();render();
  toast('Congelado. Vale hasta el '+fmt(add(today(),c.frz)),true);
}
function thaw(id){
  var p=find(id),c=cat(p);
  snap();p.frozenOn=null;p.thawedOn=today();save();closeSheet();render();
  toast('Descongelado. Consúmelo en '+c.thaw+(c.thaw===1?' día':' días'),true);
}
function setQty(id,i){
  var p=find(id),v=(i+1)*25;
  if((p.qty==null?100:p.qty)===v)v-=25;
  if(v<=0){consume(id);return}
  p.qty=v;save();render();
}

/* editor */
function readPhoto(file,cb){
  var fr=new FileReader();
  fr.onload=function(){var im=new Image();im.onload=function(){var r=Math.min(1,240/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*r);cv.height=Math.round(im.height*r);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);cb(cv.toDataURL('image/jpeg',.72))};im.src=fr.result};
  fr.readAsDataURL(file);
}
function val(v){return v==null?'':v}
function openEditor(p,draft){
  var d=p||draft||{},k=d.cat||'otro',c=CATS[k],n=d.nut||{};
  E={id:p?p.id:null,img:d.img||null,qty:d.qty==null?100:d.qty,touched:!!p||!!d.exp};
  var exp=d.exp||add(today(),c.def),s=p?st(p):null,h='';
  h+='<div class="row" style="justify-content:space-between"><h2 style="margin:0">'+(p?'Editar producto':'Nuevo producto')+'</h2><button class="btn sm" data-act="close" aria-label="Cerrar">Cerrar</button></div>';
  h+='<div class="ph" style="margin-top:12px"><div id="e-thumb" data-act="photo">'+thumbHtml(E.img,k)+'</div><div class="note">Toca el cuadro para añadir o cambiar la foto del producto.</div><input type="file" id="e-file" accept="image/*" capture="environment" hidden></div>';
  if(p)h+='<div class="row" style="margin-top:12px">'+stamp(s)+'<div class="info"><div class="meta">'+chips(p,s)+'</div><div class="when">'+whenTxt(p,s)+'</div></div></div>';
  h+='<label class="f"><span>Nombre</span><input id="e-name" type="text" value="'+esc(d.name||'')+'" placeholder="Por ejemplo, yogur natural"></label>';
  h+='<label class="f"><span>Tipo de alimento</span><select id="e-cat">'+CAT_ORDER.map(function(x){return '<option value="'+x+'"'+(x===k?' selected':'')+'>'+CATS[x].e+' '+CATS[x].l+'</option>'}).join('')+'</select></label>';
  h+='<div class="g2"><label class="f"><span>Fecha de caducidad</span><input id="e-exp" type="date" value="'+exp+'"></label><label class="f"><span>Código de barras</span><input id="e-code" type="text" inputmode="numeric" value="'+esc(d.code||'')+'"></label></div>';
  h+='<label class="tog" style="padding:6px 0"><span>Fecha aproximada<small id="e-hint"></small></span><input id="e-apx" type="checkbox" style="width:26px;height:26px"'+((p?p.apx:d.apx!==false&&!d.exp)?' checked':'')+'></label>';
  h+='<div class="g2"><label class="f"><span>Abierto el día</span><input id="e-open" type="date" value="'+val(p&&p.openedOn)+'"></label><div style="align-self:end"><button class="btn sun block" data-act="opentoday">Lo abrí hoy</button></div></div><p class="note" id="e-opennote" style="margin:6px 0 0"></p>';
  h+='<div class="f"><span>Cuánto queda</span><div class="chips" style="padding-bottom:0" id="e-qty">'+[25,50,75,100].map(function(q){return '<button class="btn sm'+(E.qty===q?' on':'')+'" data-act="eq" data-v="'+q+'">'+q+'%</button>'}).join('')+'</div></div>';
  h+='<div class="f"><span>Valores nutricionales por 100 g</span></div><div class="g3"><label class="f"><span>Calorías</span><input id="e-kcal" type="number" step="any" inputmode="decimal" value="'+val(n.kcal)+'"></label><label class="f"><span>Grasa</span><input id="e-fat" type="number" step="any" inputmode="decimal" value="'+val(n.fat)+'"></label><label class="f"><span>Grasa sat.</span><input id="e-sat" type="number" step="any" inputmode="decimal" value="'+val(n.sat)+'"></label></div><div class="g3"><label class="f"><span>Azúcar</span><input id="e-sug" type="number" step="any" inputmode="decimal" value="'+val(n.sug)+'"></label><label class="f"><span>Sal</span><input id="e-salt" type="number" step="any" inputmode="decimal" value="'+val(n.salt)+'"></label><label class="f"><span>Ración (g)</span><input id="e-por" type="number" step="any" inputmode="decimal" value="'+val(d.por)+'" placeholder="100"></label></div>';
  h+='<button class="btn pri block" style="margin-top:16px" data-act="save">'+(p?'Guardar cambios':'Añadir a la despensa')+'</button>';
  if(p){
    h+='<p class="sec">Congelador</p>';
    if(p.frozenOn)h+='<button class="btn ice block" data-act="thaw" data-id="'+p.id+'">Descongelar</button><p class="note" style="margin-top:6px">Al descongelarlo tendrás '+c.thaw+(c.thaw===1?' día':' días')+' para consumirlo.</p>';
    else if(!c.frz)h+='<p class="note">Este tipo de alimento no se recomienda congelarlo.</p>';
    else if(p.thawedOn)h+='<p class="note">Ya estuvo congelado. No conviene volver a congelarlo.</p>';
    else if(s.d<0)h+='<p class="note">Está pasado de fecha, mejor no congelarlo.</p>';
    else h+='<button class="btn ice block" data-act="freeze" data-id="'+p.id+'">Congelar y alargar su vida '+frzTxt(c)+'</button><p class="note" style="margin-top:6px">Quedaría bueno hasta el '+fmt(add(today(),c.frz))+'.</p>';
    h+='<div class="g3" style="margin-top:18px;grid-template-columns:1fr 1fr 1fr"><button class="btn lime sm" data-act="consume" data-id="'+p.id+'">Consumido</button><button class="btn sm" data-act="waste" data-id="'+p.id+'">Tirar</button><button class="btn sm" data-act="del" data-id="'+p.id+'">Eliminar</button></div>';
  }
  $('#sheet').innerHTML='<div class="panel">'+h+'</div>';
  $('#sheet').classList.add('open');
  hint();
}
function thumbHtml(img,k){return '<div class="thumb big">'+(img?'<img src="'+esc(img)+'" alt="" onerror="this.remove()">':CATS[k].e)+'</div>'}
function hint(){
  var k=$('#e-cat')?$('#e-cat').value:'otro',c=CATS[k];
  var a=$('#e-hint'),o=$('#e-opennote');
  if(a)a.textContent=$('#e-apx').checked?'Estimada según el tipo, unos '+c.def+' días':'La que figura en el envase';
  if(o)o.textContent='Una vez abierto, este tipo de alimento dura unos '+c.open+(c.open===1?' día':' días')+'.';
}
function readEd(p){
  var k=$('#e-cat').value;
  p.name=$('#e-name').value.trim();p.cat=k;
  p.exp=$('#e-exp').value||add(today(),CATS[k].def);
  p.apx=$('#e-apx').checked;p.code=$('#e-code').value.trim();
  p.openedOn=$('#e-open').value||null;p.img=E.img;p.qty=E.qty;
  p.nut={kcal:num('e-kcal'),fat:num('e-fat'),sat:num('e-sat'),sug:num('e-sug'),salt:num('e-salt')};
  p.por=num('e-por');
}
function saveEd(){
  var name=$('#e-name').value.trim();
  if(!name){toast('Ponle un nombre al producto');$('#e-name').focus();return}
  var p=E.id?find(E.id):{id:uid(),addedOn:today()};
  readEd(p);
  if(!E.id)S.items.unshift(p);
  save();closeSheet();
  if(ui.tab==='scan')ui.tab='home';
  render();toast(E.id?'Cambios guardados':'Añadido a tu despensa');
}
function closeSheet(){$('#sheet').classList.remove('open');$('#sheet').innerHTML='';E=null}

/* cámara y búsqueda */
function camMsg(t){var m=$('#cammsg');if(m)m.textContent=t}
function stopCam(){
  if(camTimer){clearInterval(camTimer);camTimer=null}
  if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}
  busy=false;
}
async function startCam(){
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){camMsg('Aquí no se puede usar la cámara. Escribe el código.');return}
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});
    var v=$('#vid');v.srcObject=stream;await v.play();
  }catch(e){stopCam();camMsg('No pude abrir la cámara. Escribe el código a mano.');return}
  if(!('BarcodeDetector' in window)){camMsg('Este navegador no lee códigos solo. Escribe el código.');return}
  try{det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e']})}catch(e){camMsg('Este navegador no lee códigos solo. Escribe el código.');return}
  camMsg('Buscando código de barras…');
  camTimer=setInterval(function(){
    var v=$('#vid');if(!v||busy)return;
    det.detect(v).then(function(r){
      if(r&&r.length&&!busy){busy=true;try{if(navigator.vibrate)navigator.vibrate(60)}catch(e){}stopCam();busy=true;lookup(r[0].rawValue)}
    }).catch(function(){});
  },300);
}
function guessCat(tags){
  var t=tags.join(' ').toLowerCase();
  var R=[['yogur',/yogurt/],['queso',/cheese/],['leche',/milk/],['embutido',/cold-cut|ham|sausage|charcuterie/],['carne',/meat|poultry|chicken/],['pescado',/fish|seafood/],['verdura',/vegetable/],['fruta',/fruit/],['pan',/bread/],['huevos',/egg/],['salsa',/sauce|tomato/],['legumbre',/legume|pulse/],['snack',/biscuit|snack|cookie|chocolate/],['bebida',/beverage|juice|soda|water/],['pasta',/pasta|rice|cereal/],['untable',/spread|hummus|jam/]];
  for(var i=0;i<R.length;i++)if(R[i][1].test(t))return R[i][0];
  return 'otro';
}
async function lookup(code){
  code=String(code||'').replace(/\D/g,'');
  if(code.length<6){toast('Revisa el código de barras');return}
  var draft={code:code,apx:true};
  if(DEMO[code]){var D=DEMO[code];draft.name=D.name;draft.cat=D.cat;draft.nut=D.nut;draft.por=D.por;openEditor(null,draft);toast('Producto de ejemplo cargado');return}
  toast('Buscando el producto…');
  try{
    var ctl=new AbortController(),to=setTimeout(function(){ctl.abort()},6000);
    var r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+code+'.json?fields=product_name,brands,nutriments,image_front_small_url,categories_tags,serving_quantity',{signal:ctl.signal});
    clearTimeout(to);
    var j=await r.json();
    if(j&&j.status===1&&j.product){
      var pr=j.product,n=pr.nutriments||{};
      draft.name=(pr.product_name||'')+(pr.brands?' '+pr.brands.split(',')[0]:'');
      draft.cat=guessCat(pr.categories_tags||[]);
      draft.nut={kcal:n['energy-kcal_100g']!=null?n['energy-kcal_100g']:null,fat:n.fat_100g!=null?n.fat_100g:null,sat:n['saturated-fat_100g']!=null?n['saturated-fat_100g']:null,sug:n.sugars_100g!=null?n.sugars_100g:null,salt:n.salt_100g!=null?n.salt_100g:null};
      draft.por=Number(pr.serving_quantity)||null;
      if(pr.image_front_small_url)draft.img=pr.image_front_small_url;
      openEditor(null,draft);toast('Producto encontrado. Revisa los datos');return;
    }
    openEditor(null,draft);toast('No encontré ese código. Rellénalo a mano');
  }catch(e){
    openEditor(null,draft);toast('No pude consultar la base de datos. Rellénalo a mano');
  }
}

    mk('Tomate frito','salsa',200,{},{kcal:80,fat:3.5,sat:.5,sug:7,salt:.9},100),
    mk('Filetes de merluza','pescado',2,{frozenOn:add(t,-20),apx:true},{kcal:80,fat:1,sat:.2,sug:0,salt:.2},150),

/* eventos */
function act(a,id,v,el){
  switch(a){
    case 'tab':ui.tab=v;render();window.scrollTo(0,0);break;
    case 'filter':ui.f=v;render();break;
    case 'open':var p=find(id);if(p)openEditor(p);break;
    case 'add':openEditor(null,{});break;
    case 'seed':seed();break;
    case 'bite':setQty(id,+v);break;
    case 'consume':consume(id);break;
    case 'waste':waste(id);break;
    case 'del':del(id);break;
    case 'freeze':case 'thaw':
      if(E&&E.id===id&&$('#e-name')&&$('#e-name').value.trim())readEd(find(id));
      a==='freeze'?freeze(id):thaw(id);break;
    case 'save':saveEd();break;
    case 'close':closeSheet();break;
    case 'photo':$('#e-file').click();break;
    case 'eq':E.qty=+v;[].forEach.call(document.querySelectorAll('#e-qty .btn'),function(b){b.classList.toggle('on',+b.dataset.v===E.qty)});break;
    case 'opentoday':$('#e-open').value=today();break;
    case 'cam':startCam();break;
    case 'scango':lookup($('#code').value);break;
    case 'demo':lookup(v);break;
    case 'shopadd':var i=$('#shopname');if(i&&addShop(i.value)){save();render()}break;
    case 'shoptog':S.shop.forEach(function(s){if(s.id===id)s.done=!s.done});save();render();break;
    case 'shopdel':S.shop=S.shop.filter(function(s){return s.id!==id});save();render();break;
    case 'shopclear':S.shop=S.shop.filter(function(s){return !s.done});save();render();break;
    case 'win':S.set.win=Math.max(1,Math.min(7,S.set.win+(+v)));save();render();break;
    case 'auto':S.set.auto=!S.set.auto;save();render();break;
    case 'notif':
      if(S.set.notif){S.set.notif=false;save();render();break}
      if(!('Notification' in window)){toast('Este navegador no permite avisos');break}
      try{Notification.requestPermission().then(function(r){if(r==='granted'){S.set.notif=true;save();render();maybeNotify();toast('Avisos activados')}else toast('No se concedió el permiso')})}catch(e){toast('No se pudieron activar los avisos')}
      break;
    case 'wipe':
      if(!ui.wipe){ui.wipe=true;render();setTimeout(function(){ui.wipe=false;if(ui.tab==='more')render()},3000)}
      else{ui.wipe=false;snap();S.items=[];S.log=[];S.shop=[];save();render();toast('Todo borrado',true)}
      break;
    case 'undo':if(lastSnap){S=JSON.parse(lastSnap);save();closeSheet();render();$('#toast').classList.remove('show')}break;
  }
}
document.addEventListener('click',function(e){
  if(e.target.id==='sheet'){closeSheet();return}
  var t=e.target.closest('[data-act]');if(!t)return;
  act(t.dataset.act,t.dataset.id,t.dataset.v,t);
});
document.addEventListener('input',function(e){
  if(e.target.id==='q'){ui.q=e.target.value;var l=$('#list');if(l)l.innerHTML=listHTML()}
  if(e.target.id==='e-exp'&&E){E.touched=true;$('#e-apx').checked=false;hint()}
});
document.addEventListener('change',function(e){
  var id=e.target.id;
  if(id==='e-cat'&&E){if(!E.touched){$('#e-exp').value=add(today(),CATS[e.target.value].def);$('#e-apx').checked=true}var th=$('#e-thumb');if(th)th.innerHTML=thumbHtml(E.img,e.target.value);hint()}
  if(id==='e-apx'&&E)hint();
  if(id==='e-file'&&e.target.files&&e.target.files[0]){readPhoto(e.target.files[0],function(d){E.img=d;$('#e-thumb').innerHTML=thumbHtml(d,$('#e-cat').value)})}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'&&E)closeSheet();
  if(e.key==='Enter'&&e.target.id==='code')lookup(e.target.value);
  if(e.key==='Enter'&&e.target.id==='shopname')act('shopadd');
});

load();render();maybeNotify();
})();
